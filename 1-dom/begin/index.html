<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Frontend System Design Fundamentals</title>
    <link rel="stylesheet" href="./index.css" />
    <!-- Template tag is a document fragment it does not cause a reflow when querying it and it is not rendered in the DOM -->
    <template id="card-template">
      <article class="card">
        <h3 class="card__title"></h3>
        <div class="card__body">
          <div class="card__body__image"></div>
          <section class="card__body__content"></section>
        </div>
      </article>
    </template>
  </head>
  <body>
    <main id="container"></main>
  </body>
  <script>
    const container = document.getElementById("container");
    const html = ``;

    /**
     * @param {string} title
     * @param {string} body
     *
     * @return {HTMLElement
     */
    function createCardComponent(title, body) {
      // @todo - Implement function
      const card = document.getElementById("card-template").content.cloneNode(true).firstElementChild;
      [titleTag, bodyTag] = card.querySelectorAll(".card__title, .card__body__content");
      titleTag.textContent = title;
      bodyTag.textContent = body;
      return card;
    }

    const component = createCardComponent(
      "Frontend System Design: Fundamentals",
      "This is a random body text"
    );

    container.appendChild(component);
  </script>
</html>
